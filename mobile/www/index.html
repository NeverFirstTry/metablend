<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MetaBlend</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e0e12; color: #e4e4e7; font-family: ui-monospace, Menlo, monospace; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0; }
    p { color: #a1a1aa; font-size: 14px; margin: 0; }
    a { background: #34d399; color: #000; font-weight: 700; padding: 12px 24px; border-radius: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <!-- Shown when the app starts without a connection (Capacitor errorPath). -->
  <main>
    <h1>MetaBlend</h1>
    <p>No connection · Keine Verbindung</p>
    <a href="https://metablend.app/">Retry</a>
  </main>
</body>
</html>
